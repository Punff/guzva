; guzva — ESP32-CAM capture firmware (fresh build, PLAN §5)
; AI-Thinker ESP32-CAM / OV2640 · PlatformIO + arduino-esp32 + esp32-camera
; https://github.com/espressif/esp32-camera
;
; Docs: https://docs.platformio.org/page/projectconf.html
;
; W4 pins: the platform and the camera driver are frozen at the versions the
; bench actually ran (espressif32 7.0.1 = arduino-esp32 2.0.17, esp32-camera
; 2.0.4). An unpinned build is a different firmware wearing the same name.
; Bump deliberately, with a bench session — never by accident of install date.

[env:esp32cam]
platform = espressif32@7.0.1
board = esp32cam
framework = arduino

; Serial monitor / upload (ESP32-CAM via CH340)
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
upload_speed = 921600

; 4MB partition table: "Default 4MB with spiffs" (app0+app1+spiffs, OTA-capable).
; The esp32cam board default is huge_app.csv — overridden explicitly.
; NEVER huge_app: no OTA slot (PLAN §5).
board_build.partitions = default.csv

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  ; TLS escape hatch: 0 = production (verify against CA_ROOT_PEM in
  ; include/settings.h). Production builds are grep-gated:
  ; `grep -rn setInsecure firmware/` must only ever hit the #if INSECURE_TLS
  ; guarded branch, and INSECURE_TLS must be 0.
  -DINSECURE_TLS=0

; W4: -w (suppress ALL warnings) is gone. Library noise may return; our own
; code must compile loud. Suppress specific classes below if a pinned
; library floods, never wholesale again.

lib_deps =
  esp32-camera@2.0.4

; Stamp git describe into FW_VERSION (main.cpp falls back to "dev").
extra_scripts = pre:tools/fwversion.py
