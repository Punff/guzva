; imaliguzve — ESP32-CAM capture firmware (fresh build, PLAN §5)
; AI-Thinker ESP32-CAM / OV2640 · PlatformIO + arduino-esp32 + esp32-camera
; https://github.com/espressif/esp32-camera
;
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; Serial monitor / upload (ESP32-CAM via CH340)
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
upload_speed = 921600

; 4MB partition table: "Default 4MB with spiffs" (app0+app1+spiffs, OTA-capable).
; The esp32cam board default is huge_app.csv — overridden explicitly.
; NEVER huge_app: no OTA slot (PLAN §5).
board_build.partitions = default.csv

build_flags =
  -w
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  ; TLS escape hatch: 0 = production (verify against CA_ROOT_PEM in
  ; include/settings.h). Production builds are grep-gated:
  ; `grep -rn setInsecure firmware/` must only ever hit the #if INSECURE_TLS
  ; guarded branch, and INSECURE_TLS must be 0.
  -DINSECURE_TLS=0

lib_deps =
  esp32-camera
