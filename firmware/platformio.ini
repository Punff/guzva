; PlatformIO Project Configuration — imaliguzve lean capture firmware (PLAN §5)
; Adapted from the repo-root demo config; Phase 1 build steps 1-4.
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; Serial monitor / upload settings for ESP32-CAM via CH340 (/dev/ttyUSB0)
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
upload_speed = 921600

; Default 4MB partition table: "Default 4MB with spiffs" (app0+app1+spiffs,
; OTA-capable). NOTE: the esp32cam board's built-in default is huge_app.csv —
; we override it explicitly. NEVER use hugeapp/huge_app: no OTA slot, and
; PLAN §5 keeps the partition table "never hugeapp".
board_build.partitions = default.csv

build_flags =
  -w
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  ; TLS escape hatch: 0 = production (verify against CA_ROOT_PEM in
  ; include/wifiSettings.h). Set to 1 ONLY for bench experiments.
  ; Production builds are grep-gated: `grep -rn setInsecure firmware/` must only
  ; ever hit the #if INSECURE_TLS guarded branch, and INSECURE_TLS must be 0.
  -DINSECURE_TLS=0

lib_deps =
  esp32-camera
