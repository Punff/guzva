; PlatformIO Project Configuration File for ESP32-CAM demo
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; Serial monitor / upload settings for ESP32-CAM via CH340 (/dev/ttyUSB0)
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
upload_speed = 921600

; Default 4MB partition (1.2MB app + SPIFFS) keeps OTA working.
; NOTE: Do NOT switch to hugeapp.csv if you want /ota to work -
; hugeapp has no OTA slot. The sketch notes this on the /ota page.
; If you ever get "program too large" errors, either:
;   1. disable OTA (#define ENABLE_OTA 0 in src/main.cpp), then use hugeapp, or
;   2. keep OTA and optimise.
;board_build.partitions = hugeapp.csv

build_flags =
  -w
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

lib_deps =
  esp32-camera
