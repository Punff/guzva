# litestream.yml — Litestream replication for the imaliguzve SQLite DB.
# Installed to /etc/litestream.yml by deploy/provision.sh (which substitutes
# the CHANGE-ME placeholders with $BUCKET / $S3_REGION / $S3_ENDPOINT).
#
# What IS backed up (PLAN §8):
#   - imaliguzve.db — venues, devices, frames metadata, sessions, hours …
#   - ref/ — the reference frames, copied separately (nightly rsync/restic to
#     the same bucket; small, static files, not worth a streaming replica).
# What is NOT backed up: the 48 h public-stills ring — images are a 48 h ring
# (D2), never backed up 1:1.
#
# Targets (PLAN §8): RPO < 5 min via continuous replication (sync-interval
# below), plus a nightly snapshot generation policy. One restore drill logged
# with a timer BEFORE the pilot, then quarterly (docs/ops-log.md).
#
# Credentials: never in this file. Litestream reads them from the environment:
#   LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY
#   (or the standard AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
# Note: this file targets Litestream v0.5.x (`replica:` singular). v0.3 used
# a `replicas:` array — see https://litestream.io/reference/config/.

# Nightly snapshot policy (PLAN §8): one full snapshot per day, kept 30 days;
# continuous replication in between provides the <5 min RPO.
snapshot:
  interval: 24h    # nightly full snapshot
  retention: 720h  # keep 30 days of snapshot generations, then prune

dbs:
  - path: /var/lib/imaliguzve/imaliguzve.db
    monitor-interval: 1s   # notice WAL changes within a second
    replica:
      type: s3
      bucket: CHANGE-ME-bucket     # PLACEHOLDER — your bucket name
      region: CHANGE-ME-region     # PLACEHOLDER — bucket region
      endpoint: CHANGE-ME-endpoint # PLACEHOLDER — S3-compatible endpoint URL
                                   #   (delete this line for real AWS S3)
      path: imaliguzve/db          # key prefix inside the bucket
      sync-interval: 5s            # push WAL changes every 5 s → RPO ≪ 5 min
      # force-path-style is enabled automatically when endpoint is set.
