<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Name}} — live still</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 44rem; margin-inline: auto; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: .75rem; margin-bottom: .75rem; }
  h1 { font-size: 1.4rem; margin: 0; }
  .badge { display: inline-block; font-size: .8rem; padding: .2em .6em; border-radius: 1em; font-weight: 600; }
  .badge.fresh { background: #d7f5d7; color: #145214; }
  .badge.stale { background: #ffe6b3; color: #7a4b00; }
  .badge.unknown { background: #e4e4e4; color: #555; }
  .badge.open { background: #dceeff; color: #0b4a80; }
  .badge.closed { background: #eeeeee; color: #666; }
  .still { background: #000; border-radius: 12px; overflow: hidden; line-height: 0; }
  .still img { width: 100%; height: auto; display: block; }
  .still-empty { color: #888; padding: 3rem 0; text-align: center; line-height: 1.4; }
  footer { margin-top: .75rem; font-size: .78rem; color: #888; }
  @media (prefers-color-scheme: dark) {
    .badge.fresh { background: #123b12; color: #b7f0b7; }
    .badge.stale { background: #4a3200; color: #ffd98a; }
    .badge.unknown { background: #333; color: #aaa; }
    .badge.open { background: #10314a; color: #a9d5ff; }
    .badge.closed { background: #2c2c2c; color: #999; }
    footer { color: #666; }
  }
</style>
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header>
  <h1>{{.Name}}</h1>
  <span id="badge" hx-get="/v/{{.Slug}}/status" hx-trigger="load, every 10s" hx-swap="innerHTML">{{template "badge.html" .}}</span>
</header>
<main>
  <div class="still" id="still" hx-get="/v/{{.Slug}}/still" hx-trigger="every 10s" hx-swap="innerHTML">
    {{if .HasFrame}}<img src="{{.FrameURL}}?v={{.StillVer}}" alt="stylised still" width="640">{{else}}<div class="still-empty">No frame yet — waiting for the venue camera…</div>{{end}}
  </div>
</main>
<footer>This page shows a stylised render. The raw camera image is never stored or published.</footer>
</body>
</html>
