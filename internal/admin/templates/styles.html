{{define "styles.html"}}<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 60rem; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 1.5rem; }
  h3 { font-size: .95rem; margin: .4rem 0; display: flex; flex-wrap: wrap; gap: .5rem; align-items: baseline; }
  a { color: inherit; }
  code { background: #eee; padding: .1em .35em; border-radius: 4px; font-size: .85em; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { text-align: left; padding: .3em .5em; border-bottom: 1px solid #ddd; }
  th { color: #777; font-weight: 600; }
  .badge { display: inline-block; font-size: .75rem; padding: .1em .55em; border-radius: 1em; font-weight: 600; }
  .badge.fresh { background: #d7f5d7; color: #145214; }
  .badge.stale { background: #ffe6b3; color: #7a4b00; }
  .badge.unknown { background: #e4e4e4; color: #555; }
  .muted { color: #888; font-size: .85rem; }
  .age { color: #888; font-size: .8rem; font-weight: 400; }
  .amber { background: #fff3cd; color: #7a5b00; }
  form.inline { display: inline; }
  button, input, select { font: inherit; padding: .3em .5em; border-radius: 6px; border: 1px solid #bbb; }
  button { cursor: pointer; }
  .formgrid { display: grid; grid-template-columns: max-content 1fr; gap: .4rem .75rem; align-items: center; max-width: 34rem; }
  #flash { min-height: 1.2em; }
  #flash .err { background: #ffe0e0; color: #7a1414; padding: .3em .6em; border-radius: 6px; }
  #flash .ok { background: #d7f5d7; color: #145214; padding: .3em .6em; border-radius: 6px; }
  #token-out .tok { background: #101820; color: #9fe8a0; font-family: ui-monospace, monospace; padding: .5em .7em; border-radius: 6px; word-break: break-all; }
  #token-out .warn { color: #a05a00; font-weight: 600; font-size: .85rem; }
  @media (prefers-color-scheme: dark) {
    code { background: #2c2c2c; }
    th, td { border-color: #444; }
    th { color: #999; }
    .badge.unknown { background: #333; color: #aaa; }
    .badge.fresh { background: #123b12; color: #b7f0b7; }
    .badge.stale { background: #4a3200; color: #ffd98a; }
    .amber { background: #4a3200; color: #ffd98a; }
    .muted, .age { color: #888; }
    button, input, select { background: #1c1c1c; border-color: #555; }
    #flash .ok { background: #123b12; color: #b7f0b7; }
    #flash .err { background: #4a1414; color: #ffb3b3; }
  }
</style>{{end}}
