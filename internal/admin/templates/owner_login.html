{{define "owner_login.html"}}<!doctype html>
<html lang="hr">
<head>
{{template "shell-head.html" .}}
<title>guzva — prijava</title>
</head>
<body class="bg-paper text-ink font-sans">
<main class="min-h-dvh grid place-items-center p-4">
  <div class="w-full max-w-sm">
    <h1 class="text-2xl font-bold tracking-tight mb-1">guzva</h1>
    <p class="text-sm text-muted mb-5">Prijava vlasnika objekta.</p>
    {{if .Err}}<div class="border-2 border-accent bg-paper px-3 py-2 text-sm mb-4" role="alert">{{.Err}}</div>{{end}}
    <form method="post" action="/owner/login" class="border-2 border-ink bg-paper shadow-step p-4 grid gap-3">
      <div class="grid gap-1">
        <label class="text-xs font-semibold uppercase tracking-widest text-muted" for="slug">Objekat</label>
        <input class="w-full border-2 border-ink bg-paper px-3 min-h-11 text-base" id="slug" name="slug" placeholder="jadro" autofocus autocomplete="username">
      </div>
      <div class="grid gap-1">
        <label class="text-xs font-semibold uppercase tracking-widest text-muted" for="password">Lozinka</label>
        <input class="w-full border-2 border-ink bg-paper px-3 min-h-11 text-base" type="password" id="password" name="password" autocomplete="current-password">
      </div>
      <button class="inline-flex items-center justify-center border-2 border-ink bg-accent text-paper px-4 min-h-11 font-semibold shadow-step-sm tap" type="submit">Prijava</button>
    </form>
    <p class="text-xs text-muted mt-4">Pristup izdaje administrator. Tokeni uređaja i postavke kamere ostaju kod njega — ovaj panel pokriva podatke o objektu i stanje.</p>
  </div>
</main>
</body>
</html>{{end}}
