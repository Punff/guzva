{{define "owner_login.html"}}<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>guzva — prijava</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d10'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%237ee787' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/admin/app.css">
</head>
<body class="min-h-dvh grid place-items-center p-4 bg-[var(--color-bg)] text-[var(--color-ink)] font-sans">
  <main class="w-full max-w-sm">
    <h1 class="text-xl font-semibold tracking-tight mb-1">guzva</h1>
    <p class="muted mb-5">Prijava vlasnika objekta.</p>
    {{if .Err}}<div class="flash flash--err mb-4" role="alert">{{.Err}}</div>{{end}}
    <form method="post" action="/owner/login" class="card p-5 grid gap-3">
      <div class="field">
        <label for="slug">Identifikator objekta</label>
        <input class="input" id="slug" name="slug" placeholder="jadro" autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Lozinka</label>
        <input class="input" type="password" id="password" name="password" autocomplete="current-password">
      </div>
      <button class="btn w-full" type="submit">Prijava</button>
    </form>
    <p class="muted mt-4 text-xs">Pristup izdaje administrator. Tokeni uređaja i postavke kamere ostaju kod njega — ovaj panel pokriva podatke o objektu i stanje.</p>
  </main>
</body>
</html>{{end}}
