{{define "login.html"}}<!doctype html>
<html lang="en">
<head>
{{template "shell-head.html" .}}
<title>guzva — admin</title>
</head>
<body class="bg-paper text-ink font-sans">
<main class="min-h-dvh grid place-items-center p-4">
  <div class="w-full max-w-sm">
    <h1 class="text-2xl font-bold tracking-tight mb-1">guzva</h1>
    <p class="text-sm text-muted mb-5">Sign in to the admin console.</p>
    {{if .Err}}<div class="border-2 border-accent bg-paper px-3 py-2 text-sm mb-4" role="alert">{{.Err}}</div>{{end}}
    <form method="post" action="/admin/login" class="border-2 border-ink bg-paper shadow-step p-4 grid gap-3">
      <div class="grid gap-1">
        <label class="text-xs font-semibold uppercase tracking-widest text-muted" for="password">Password</label>
        <input class="w-full border-2 border-ink bg-paper px-3 min-h-11 text-base" type="password" id="password" name="password" autofocus autocomplete="current-password">
      </div>
      <button class="inline-flex items-center justify-center border-2 border-ink bg-accent text-paper px-4 min-h-11 font-semibold shadow-step-sm tap" type="submit">Sign in</button>
    </form>
    <p class="text-xs text-muted mt-4">Sessions are signed cookies (§6.5); the raw camera image never appears here or on public pages.</p>
  </div>
</main>
</body>
</html>{{end}}
