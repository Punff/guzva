{{define "token.html"}}<div class="card card--raised">
  <p class="text-sm text-muted">Device <strong class="text-ink">{{.Serial}}</strong> created. Put this token into <code class="font-mono text-ink">firmware/include/settings.h</code> (copy from <code class="font-mono text-ink">settings.example.h</code>):</p>
  <p class="font-mono text-sm p-3 mt-2 mb-2 bg-ink text-s3 break-all">{{.Token}}</p>
  <p class="text-xs text-accent"><strong>STORE THIS TOKEN NOW — IT IS SHOWN ONLY ONCE.</strong> Only its sha256 is stored.</p>
</div>{{end}}
