{{/* Shared by every public page (venue.html, privacy.html). */}}
{{define "logomark"}}
    <!-- Logomark: "the tally label" — a thermal label (perforated tear
         edge) printing three rising crowd bars, the peak in signal red
         (Appendix C). 16-cell grid at 32 px = 2 px per cell, crisp. -->
    <svg viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges" aria-hidden="true" class="shrink-0">
      <rect width="16" height="16" fill="var(--ink)"/>
      <rect x="2" y="2" width="12" height="11" fill="var(--paper)"/>
      <rect x="2" y="13" width="1" height="1" fill="var(--paper)"/>
      <rect x="4" y="13" width="1" height="1" fill="var(--paper)"/>
      <rect x="6" y="13" width="1" height="1" fill="var(--paper)"/>
      <rect x="8" y="13" width="1" height="1" fill="var(--paper)"/>
      <rect x="10" y="13" width="1" height="1" fill="var(--paper)"/>
      <rect x="12" y="13" width="1" height="1" fill="var(--paper)"/>
      <rect x="3" y="9" width="2" height="3" fill="var(--s1)"/>
      <rect x="7" y="7" width="2" height="5" fill="var(--s1)"/>
      <rect x="11" y="5" width="2" height="7" fill="var(--accent)"/>
    </svg>{{end}}
